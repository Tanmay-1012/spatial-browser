name: Branded Chrome 109 Runtime Verification

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-109-runtime:
    name: Chrome 109 E2E (Disposable Windows VM)
    if: github.ref == 'refs/heads/investigation/task-17-chrome109-runtime'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Build the extension
        run: npm.cmd run build

      - name: Run automated verification suite
        run: npm.cmd test

      - name: Verify Chrome 109 package provenance, extract without installation, then run E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msiUrl = 'https://archive.org/download/chrome-109-Win7-8/Chrome%20109%20%28Enterprise%29%20x64.msi'
          $expectedMsiHash = '0adace05d1cff3bf24feff3f79efd111798bd7ba32e2acd8d0494ffd6e166b8e'
          $installerUrl = 'https://dl.google.com/release2/chrome/ggsdppo5kshsyqe3fej7lv4tau_109.0.5414.165/109.0.5414.165_chrome_installer.exe'
          $expectedInstallerHash = 'a1e8be08baf5ea4e6cb8a33158481132ecb3f2ffb0a9bb33a172395eba1379cb'
          $expectedInstallerSize = 93128752
          $expectedThumbprint = '2673EA6CC23BEFFDA49AC715B121544098A1284C'
          $msiPath = Join-Path $env:RUNNER_TEMP 'chrome-109-enterprise-x64.msi'
          $installerPath = Join-Path $env:RUNNER_TEMP '109.0.5414.165-chrome-installer.exe'

          Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath
          $actualMsiHash = (Get-FileHash -LiteralPath $msiPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualMsiHash -ne $expectedMsiHash) { throw "Chrome MSI SHA-256 mismatch: $actualMsiHash" }

          $msiSignature = Get-AuthenticodeSignature -FilePath $msiPath
          if ($msiSignature.Status -ne 'Valid') { throw "Chrome MSI signature is not valid: $($msiSignature.Status)" }
          if ($msiSignature.SignerCertificate.Subject -notmatch 'CN=Google LLC') { throw "Unexpected MSI signer: $($msiSignature.SignerCertificate.Subject)" }
          if ($msiSignature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expectedThumbprint) { throw 'Chrome MSI signer thumbprint mismatch.' }
          Write-Host "Verified mirror MSI SHA-256 $actualMsiHash; signer $($msiSignature.SignerCertificate.Subject); thumbprint $expectedThumbprint."

          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          $installer = Get-Item -LiteralPath $installerPath
          if ($installer.Length -ne $expectedInstallerSize) { throw "Google Chrome installer size mismatch: $($installer.Length) bytes." }
          $actualInstallerHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualInstallerHash -ne $expectedInstallerHash) { throw "Google Chrome installer SHA-256 mismatch: $actualInstallerHash" }
          $installerSignature = Get-AuthenticodeSignature -FilePath $installerPath
          if ($installerSignature.Status -ne 'Valid' -or $installerSignature.SignerCertificate.Subject -notmatch 'CN=Google LLC' -or $installerSignature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expectedThumbprint) {
            throw "Google Chrome installer signature validation failed: $($installerSignature.Status), $($installerSignature.SignerCertificate.Subject)."
          }
          $installerProductVersion = $installer.VersionInfo.ProductVersion
          if ($installer.VersionInfo.ProductName -ne 'Google Chrome Installer' -or $installerProductVersion -ne '109.0.5414.165') {
            throw "Unexpected Google Chrome installer identity: $($installer.VersionInfo.ProductName) $installerProductVersion"
          }
          Write-Host "Verified Google-hosted Chrome installer $installerProductVersion; size $($installer.Length); SHA-256 $actualInstallerHash; signer $($installerSignature.SignerCertificate.Subject)."

          $chromeExtractDir = Join-Path $env:RUNNER_TEMP 'chrome-109-extracted'
          $chromePath = & .\scripts\extract-chrome-package.ps1 -InstallerPath $installerPath -Destination $chromeExtractDir
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Chrome package extraction failed with exit code $LASTEXITCODE." }
          if (-not $chromePath -or -not (Test-Path -LiteralPath $chromePath -PathType Leaf)) { throw "Chrome package extraction did not return a chrome.exe path: $chromePath" }
          $chrome = Get-Item -LiteralPath $chromePath
          $productVersion = $chrome.VersionInfo.ProductVersion

          python -m pip install --disable-pip-version-check websocket-client==1.8.0
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the pinned CDP WebSocket client for the E2E harness.' }

          $resultsDir = Join-Path $env:GITHUB_WORKSPACE 'docs\test-results'
          New-Item -ItemType Directory -Path $resultsDir -Force | Out-Null
          $env:CHROME_BINARY = $chrome.FullName
          $env:CHROME_EXTENSION_DIR = Join-Path $env:GITHUB_WORKSPACE 'outputs\chrome\unpacked'
          $env:CHROME_EXPECTED_MAJOR = '109'
          $env:CHROME_BROWSER_LABEL = "Google Chrome $productVersion (Google-signed payload; package hash matches verified MSI manifest)"
          $env:CHROME_ALLOW_CDP_ACTION_FALLBACK = '1'
          $env:CHROME_LOG_PATH = Join-Path $resultsDir 'chrome-109-branded-e2e.log'
          $env:CHROME_PRE_ERRORS_PATH = Join-Path $resultsDir 'chrome-109-branded-errors-pre-restart.json'
          $env:CHROME_POST_ERRORS_PATH = Join-Path $resultsDir 'chrome-109-branded-errors-post-restart.json'
          $env:CHROME_SCREENSHOT_PREFIX = 'chrome-109-branded'
          python scripts/e2e-chrome-verification.py
          if ($LASTEXITCODE -ne 0) { throw "Chrome 109 runtime E2E failed with exit code $LASTEXITCODE." }

      - name: Upload synthetic Chrome 109 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chrome-109-runtime-evidence
          path: |
            docs/test-results/chrome-109-branded-e2e.log
            docs/test-results/chrome-109-branded-errors-*.json
            docs/test-results/chrome-109-branded-*.png
          if-no-files-found: warn
          retention-days: 7
